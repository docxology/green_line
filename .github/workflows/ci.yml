name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the system packages the suite requires
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Test
        env:
          TMPDIR: ${{ runner.temp }}
        run: uv run --frozen --no-progress pytest -q
