[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[project]
name = "green_line"
version = "0.2.0"
description = "A capacity-under-development instrument: growth records with staged marker/counter-signal intake"
authors = [{name = "Daniel Ari Friedman", email = "daniel@activeinference.institute"}]
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=9.0.0", "pytest-cov>=7.0.0", "ruff>=0.17.0"]

[tool.ruff]
target-version = "py310"
extend-exclude = ["output"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
precision = 2
